<header style="background-color: var(--brand-color)">
    <div class="mx-auto flex max-w-3xl items-center justify-between px-4 py-5">
        {% include "public/_brand_bar.html" %}
    </div>
</header>
{% if reader.viewer.is_some() || reader.password %}
<div class="border-b border-[color:var(--theme-line)] bg-[color:var(--theme-surface-elev)] text-xs text-muted">
    <div class="mx-auto flex max-w-3xl flex-wrap items-center gap-x-3 px-4">
        {% if let Some(email) = reader.viewer %}
        <span class="py-2">{{ tr.t("access-signed-as") }} <span class="font-mono break-all text-body">{{ email }}</span></span>
        {% else %}
        <span class="py-2">{{ tr.t("access-signed-password") }}</span>
        {% endif %}
        <form method="post" action="/access/sign-out" class="ml-auto">
            <button type="submit" class="-mx-2 inline-flex min-h-10 cursor-pointer items-center px-2 hover:text-[color:var(--theme-text)]">{{ tr.t("access-sign-out") }}</button>
        </form>
    </div>
</div>
{% endif %}
{% include "public/_subscribe_dialog.html" %}
