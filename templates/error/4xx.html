{% extends "base.html" %}
{% block title %}{{ reason }} · Uptimepage{% endblock %}
{% block content %}
<section class="mx-auto max-w-md py-6">
    <div class="sticker-card space-y-2 p-8">
        <h1 class="page-title"><span class="page-title__prefix">HTTP/2</span>{{ code }} {{ reason|lower }}</h1>
        <p class="text-muted">The request was refused. Go back and try again.</p>
        <p><a href="/" class="text-sm text-muted hover:text-body">← back to dashboard</a></p>
    </div>
</section>
{% endblock %}
